<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Programming — Master Python </title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page">

<div class="stars"></div>

<div class="welcome">

  <div class="welcome-moon" aria-hidden="true"></div>

  <div class="welcome-content">
    <p class="welcome-kicker">Coding Camp</p>

    <h1 class="welcome-title">
      <span>Purple</span>
      <span>Programming</span>
    </h1>


    <div class="welcome-pills">
      <span class="welcome-pill">I — Fundamentals</span>
      <span class="welcome-pill">II — Control &amp; Functions</span>
      <span class="welcome-pill">III — Data Structures</span>
      <span class="welcome-pill">IV — OOP</span>
    </div>

    <div class="welcome-cta">
      <button id="startGame" class="btn btn-primary">
        <span aria-hidden="true">✦</span>
        <span id="startGameLabel">Begin Adventure</span>
        <span aria-hidden="true">✦</span>
      </button>
    </div>

    <p class="welcome-footnote" id="welcomeFootnote">Learning doesn't have to be boring</p>
  </div>

  <div class="welcome-ridge" aria-hidden="true">
    <svg viewBox="0 0 1440 420" preserveAspectRatio="none">
      <polygon points="0,420 0,260 120,190 260,240 400,150 560,220 700,170 860,250 1000,180 1160,240 1300,160 1440,230 1440,420"
               fill="#1c1030" opacity="0.65"/>
      <polygon points="0,420 0,320 150,250 320,300 500,230 660,290 820,220 980,300 1140,240 1300,310 1440,260 1440,420"
               fill="#120a1e"/>
      <g transform="translate(1145,150)" opacity="0.9">
        <rect x="0" y="46" width="20" height="60" fill="#0d0716"/>
        <rect x="30" y="30" width="24" height="76" fill="#0d0716"/>
        <rect x="60" y="52" width="18" height="54" fill="#0d0716"/>
        <polygon points="30,30 42,10 54,30" fill="#0d0716"/>
        <line x1="42" y1="10" x2="42" y2="0" stroke="#0d0716" stroke-width="2"/>
        <polygon points="42,0 42,7 50,3.5" fill="#8b5cf6"/>
      </g>
    </svg>
  </div>

</div>

<script src="engine/save.js"></script>
<script>
  // If the player already has progress, invite them back in rather than
  // restarting the story from zero.
  if (hasAnyProgress()) {
    document.getElementById("startGameLabel").textContent = "Continue Adventure";
    document.getElementById("welcomeFootnote").textContent = "Your progress has been saved on this computer";
  }

  document.getElementById("startGame").addEventListener("click", () => {
    window.location.href = "levels/levelSelect.html";
  });
</script>

</body>
</html>
